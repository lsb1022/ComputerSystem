<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 · 컴시개에서 살아남기</title><link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"><link rel="stylesheet" href="/login.css"></head><body><main class="login-shell"><a class="login-brand" href="/">C/S <span>컴시개에서 살아남기</span></a><section class="login-card"><h1>학습을 시작해 볼까요?</h1><form id="loginForm"><label for="studentId">학번</label><input id="studentId" name="username" inputmode="numeric" autocomplete="username" pattern="[0-9]{8}" maxlength="8" placeholder="8자리 학번" required><label for="password">비밀번호</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="전화번호 뒤 4자리" required maxlength="128"><button id="showPassword" type="button" aria-label="비밀번호 표시" aria-controls="password" aria-pressed="false" title="비밀번호 표시"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m3 3 18 18"/></svg></button></div><p id="loginError" role="alert"></p><button class="login-submit" type="submit">로그인</button></form><a class="login-help" href="mailto:lsb1022@soongsil.ac.kr">로그인이 안 되나요? 문의하기 ↗</a></section></main><script src="/login.js"></script></body></html>
